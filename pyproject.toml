[project]
name = "pixeltable-bus-depot-dashboard"
version = "0.1.0"
description = "Bus depot operations dashboard: on-time rate and p90 delay per depot and route from custom UDAs, JSON map/filter/sort over per-stop delays, distinct() lookups, a windowed running total and a data-health check for telemetry that failed to parse - built with Pixeltable"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Pierre Brunelle" }]
keywords = ["pixeltable", "multimodal", "ai", "computed-columns", "data-infrastructure", "bus-depot-dashboard"]
dependencies = [
    "pixeltable>=0.7.18",
]

[project.urls]
Homepage = "https://pixeltable.com"
Documentation = "https://docs.pixeltable.com"
Pixeltable = "https://github.com/pixeltable/pixeltable"
